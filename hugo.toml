baseURL = 'https://francoispetitit.com'
languageCode = 'fr-fr'
title = 'François Petitit'
pagination.paperSize = 10
theme = 'DoIt'

[permalinks]
  pages = "/:slug"

[params]
  logo = '/assets/favicon.ico'
  description = "Blog de François Petitit, consultant senior : architecture logicielle, développement Web, cloud et transformation des SI."
  # Image de partage par défaut (og:image) quand une page n'en a pas
  images = ['/images/avatar.webp']
  [params.author]
    name = 'François Petitit'

  [params.comments]
    enabled = true
    githubRepo = 'fpetitit/blog'
    theme = 'github-light'


[menu]
  [[menu.main]]
    identifier = "about"
    name = "À propos"
    url = "/about/"
    weight = "-110"
  [[menu.main]]
    identifier = "posts"
    name = "Articles"
    url = "/posts/"
    weight = -200
  [[menu.main]]
    identifier = "livres"
    name = "Livres"
    url = "/livres/"
    weight = -150

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'monokailight'
    tabWidth = 4

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]

[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "atom"

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "feed"

[params.home.profile]
  enable = true
  # URL of avatar shown in home page
  avatarURL = "/images/avatar.webp"
  # URL the avatar links to
  avatarLinkURL = ""


ignoreErrors = ["error-remote-getjson"]